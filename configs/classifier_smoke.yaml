# Triage classifier (issue F8). Proposal for week 10; only the smoke block is exercised now.
# Model rule (plan §6.4): the classifier comes from the OTHER family than the extractor chosen after E3.
#   extractor Qwen/Qwen3-1.7B           -> classifier meta-llama/Llama-3.2-1B-Instruct (gated; license card [TO VERIFY])
#   extractor Llama-3.2-3B-Instruct     -> classifier Qwen/Qwen3-1.7B
base_model: meta-llama/Llama-3.2-1B-Instruct
train_file: data/training/triage_train.jsonl
dev_file: data/training/triage_dev.jsonl
output_dir: results/E4/classifier
seed: 13
max_length: 128          # notes are short; p99 of generated notes is well below this
batch_size: 16
grad_accum: 1
learning_rate: 2.0e-4
epochs: 3
fp16: true               # AMP autocast; weights loaded as load_dtype
load_dtype: float32      # use bfloat16 on Ampere+ GPUs (Colab A100/L4) to halve memory
logging_steps: 20
lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]

# --smoke overrides: 50 items, a few optimizer steps, small eval
smoke:
  train_limit: 50
  dev_limit: 30
  batch_size: 4
  max_steps: 6
  epochs: 1
  logging_steps: 2
  output_dir: results/E4/classifier_smoke
