# Reproducible configuration for E1 Week 9 pruning round (issue M7, #38)
queries_path: "data/dev/rag_queries.jsonl"
synthesis_dir: "docs/knowledge"
exercises_path: "data/exercises/free-exercise-db.json"
output_dir: "results/E1/dev"

chunkings:
  - "fixed_256"
  - "fixed_512"
  - "heading"
  - "sentence_window"

embedders:
  - name: "sentence-transformers/all-MiniLM-L6-v2"
    params_m: 22.7
  - name: "BAAI/bge-small-en-v1.5"
    params_m: 33.4
  - name: "intfloat/e5-small-v2"
    params_m: 33.4

modes:
  - "dense"
  - "hybrid"

rrf_k: 60
top_k: 5
