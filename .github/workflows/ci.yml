name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install (dev + core only; the ml group needs a GPU)
        run: uv sync --locked --group dev --group core
      - name: Lint
        run: uv run --locked ruff check
      - name: Test
        run: uv run --locked pytest
