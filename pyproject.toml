[project]
name = "uni-ragsystem"
version = "0.1.0"
description = "Heuristic Load & Fatigue Analyzer: RAG + agent + fine-tuned SLM over strength-training logs."
readme = "README.md"
requires-python = "==3.11.*"
dependencies = []

[dependency-groups]
core = [
    "duckdb>=1.4",
    "pandas>=2.2,<4",
    "pydantic>=2.11,<3",
    "pyyaml>=6.0",
    "rapidfuzz>=3.10",
]
rag = [
    "chromadb>=1.0,<2",
    "rank-bm25==0.2.2",
    "sentence-transformers>=5.0",
]
mcp = ["mcp==2.3.0"]
# Needs a CUDA GPU; never installed in CI.
ml = [
    "bitsandbytes>=0.45",
    "datasets>=3.0",
    "outlines>=1.2,<2",
    "peft>=0.15",
    "transformers>=4.53",
    "trl>=0.19",
]
dev = [
    "jsonschema>=4.23",
    "pytest>=8.3",
    "ruff>=0.11",
]

[tool.uv]
package = false
default-groups = ["core", "dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["--import-mode=importlib"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# Pinned explicitly: ruff changes its default rule set between releases.
select = ["E4", "E7", "E9", "F"]
